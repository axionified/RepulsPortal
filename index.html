<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b12" />
    <title>RepulsPortal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #080b12;
            font-family: Arial, sans-serif;
        }

        #debug {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 24px;
            color: #e5e7eb;
            text-align: center;
            z-index: 2;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #263244;
            border-top-color: #22d3ee;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 2px;
        }

        #status {
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.5;
            max-width: 440px;
        }

        #repuls-frame {
            display: none;
            width: 100%;
            height: 100%;
            border: 0;
            background: #000;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner { animation: none; }
        }
    </style>
</head>

<body>
    <div id="debug" role="status" aria-live="polite">
        <div class="spinner" id="spinner"></div>
        <h1>REPULS</h1>
        <div id="status">Loading game...</div>
    </div>

    <iframe
        id="repuls-frame"
        src="https://repuls.io/"
        title="Repuls.io"
        allow="fullscreen; microphone; autoplay; clipboard-write"
        allowfullscreen>
    </iframe>

    <script>
        const frame = document.getElementById("repuls-frame");
        const debug = document.getElementById("debug");

        // When the game finishes loading, hide the spinner and show the game
        frame.onload = function() {
            debug.style.display = "none";
            frame.style.display = "block";
        };

        // Failsafe: If the iframe takes too long or the onload event doesn't fire properly,
        // force it to show the game after 2 seconds anyway.
        setTimeout(() => {
            debug.style.display = "none";
            frame.style.display = "block";
        }, 2000);
    </script>
</body>
</html>
